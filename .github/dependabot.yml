version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    ignore:
      # Trash 10 introduces an unpatched high-severity braces dependency.
      - dependency-name: trash
        update-types: [version-update:semver-major]
      # Keep Node types aligned with the supported Node 24 runtime.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # marked-katex-extension currently requires KaTeX <0.19.
      - dependency-name: katex
        versions: ['>=0.19']
    groups:
      production-minor-and-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      major-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
