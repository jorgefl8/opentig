name: Signed Windows release draft
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, for example v0.1.0'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - id: release
        run: node scripts/validate-release-tag.mjs
        env:
          OPENTIG_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - run: npm ci
      - run: npm run check
  build:
    needs: validate
    runs-on: windows-latest
    environment: release
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build signed installer and update metadata
        run: npm run make -- --release
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          OPENTIG_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      - run: npm run verify:packaged-desktop
      - run: npm run verify:packaged-server
      - run: ./scripts/verify-windows-install.ps1
      - run: npm run verify:packaged-utility
      - run: npm run verify:packaged-trash
      - run: npm run verify:release
        env:
          OPENTIG_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: |
            out/make/production/win32-x64/*Setup.exe
            out/make/production/win32-x64/*Setup.exe.blockmap
            out/make/production/win32-x64/latest.yml
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  draft:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: opentig-stable-release-draft
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release
          path: release-assets
      - name: Create draft for review; never replace a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          actual_commit="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          test "$actual_commit" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" --json isDraft,body,targetCommitish > release.json 2>/dev/null; then
            test "$(jq -r .isDraft release.json)" = true || { echo 'Refusing to replace a published release.'; exit 1; }
            if jq -e '.body | contains("<!-- opentig:release-notes:start -->")' release.json >/dev/null; then
              test "$(jq -r .targetCommitish release.json)" = "$RELEASE_COMMIT" || {
                echo 'Run Next release draft on main to reconcile notes to this tag, then retry this workflow.'
                exit 1
              }
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "OpenTig $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
