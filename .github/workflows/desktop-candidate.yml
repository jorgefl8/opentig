name: Windows installer candidate
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Validate an unsigned release with update metadata (does not publish)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run make
        if: ${{ !inputs.release_mode }}
      - run: pnpm run make --release
        if: inputs.release_mode
      - run: pnpm run verify:release
        if: inputs.release_mode
      - run: pnpm run verify:packaged-desktop
      - run: pnpm run verify:packaged-server
      - run: ./scripts/verify-windows-install.ps1
      - run: pnpm run verify:packaged-utility
      - run: pnpm run verify:packaged-trash
      - run: pnpm run verify:clipboard
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenTig-Windows-unsigned-candidate-${{ github.run_id }}
          path: |
            out/make/production/win32-x64/*Setup.exe
            out/make/production/win32-x64/*Setup.exe.blockmap
            out/make/production/win32-x64/latest.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
