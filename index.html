<html lang="en" data-ui-font="geist" data-mono-font="inconsolata">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self'; worker-src 'self' blob:; connect-src 'self' ws: http://localhost:*;" />
    <meta name="color-scheme" content="dark light" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      html:not(.dark):not(.light),
      html:not(.dark):not(.light) body,
      html:not(.dark):not(.light) #root {
        background: #171717;
        color: #f4f4f4;
        color-scheme: dark;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #171717;
        color: #a3a3a3;
        font-family: system-ui, sans-serif;
      }
      html.light #boot-shell { background: #fbfbfb; color: #5c5c5c; }
      html.dark #boot-shell { background: #171717; color: #a3a3a3; }
      #boot-shell svg { width: 48px; height: 52px; }
      html.light #boot-shell .boot-ring { fill: #1a1a1a; }
      html.dark #boot-shell .boot-ring,
      html:not(.light) #boot-shell .boot-ring { fill: #fafafa; }
      #boot-shell .boot-copy { display: grid; gap: 8px; text-align: center; }
      #boot-shell strong { color: #f4f4f4; font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
      html.light #boot-shell strong { color: #1a1a1a; }
      #boot-shell span { display: block; min-height: 1.35em; font-size: 13px; }
      #boot-shell .boot-mark {
        width: 28px;
        height: 28px;
        border: 3px solid #3a3a3a;
        border-top-color: #2266ea;
        border-radius: 50%;
        animation: boot-spin .8s linear infinite;
      }
      html.light #boot-shell .boot-mark { border-color: #d0d0d0; border-top-color: #2266ea; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-shell .boot-mark { animation: none; }
      }
    </style>
    <script src="/boot-theme.js"></script>
    <link rel="icon" href="/opentig.ico" sizes="any" />
    <link rel="icon" href="/opentig.svg" type="image/svg+xml" />
    <title>OpenTig</title>
  </head>
