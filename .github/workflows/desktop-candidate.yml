name: Windows installer candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run make
      - run: npm run verify:packaged-desktop
      - run: npm run verify:packaged-server
      - run: ./scripts/verify-windows-install.ps1
      - run: npm run verify:packaged-utility
      - run: npm run verify:packaged-trash
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenTig-Windows-unsigned-candidate-${{ github.run_id }}
          path: out/make/production/win32-x64/*Setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
