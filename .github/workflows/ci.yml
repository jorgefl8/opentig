name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit:prod

  system-trash-smoke:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/main/platform/SystemTrash.integration.test.ts
        env:
          OPENTIG_SYSTEM_TRASH_INTEGRATION: '1'
      - if: runner.os == 'Windows'
        run: npm run package
      - if: runner.os == 'Windows'
        run: npm run verify:packaged-trash

  headless-tarball-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:pack:headless
      - run: npm run release:inspect:headless
      - name: Run packed CLI with npx
        shell: bash
        run: |
          artifact="$(node -p "require('./dist/headless/opentig-headless.json').filename")"
          npx --yes --package "./dist/headless/$artifact" opentig --version
      - run: npm install --global bun@1.3.0
      - name: Run packed CLI with bunx
        shell: bash
        run: |
          artifact="$(node -p "require('./dist/headless/opentig-headless.json').filename")"
          bunx --package "./dist/headless/$artifact" opentig --version
