name: Desktop Dev builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  dev-artifacts:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: runner.os == 'Windows'
        run: npm test
      - run: npm run make:dev
      - run: npm run verify:packaged-desktop -- --dev
      - run: npm run verify:packaged-server -- --dev
      - if: runner.os == 'Windows'
        run: npm run verify:packaged-utility -- --dev
      - if: runner.os == 'Windows'
        run: npm run verify:packaged-trash -- --dev
      - name: Upload portable Dev build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenTig-Dev-${{ runner.os }}-manual-${{ github.run_id }}
          path: out/make/dev/**/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
