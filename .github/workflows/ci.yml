name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded PR runs can be cancelled; main and manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
      website: ${{ steps.scope.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: node scripts/ci-scope.mjs

  validate:
    needs: changes
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Require a successful scope decision
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SCOPE_REQUIRED: ${{ needs.changes.outputs.required }}
        run: node -e "if (process.env.SCOPE_RESULT !== 'success' || !['true', 'false'].includes(process.env.SCOPE_REQUIRED)) process.exit(1)"
      - if: needs.changes.outputs.required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.required == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: needs.changes.outputs.required == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.required == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.outputs.required == 'true' && runner.os == 'Linux'
        run: pnpm run typecheck
      - if: needs.changes.outputs.required == 'true' && runner.os == 'Linux'
        run: pnpm run lint
      - if: needs.changes.outputs.required == 'true'
        run: pnpm test
      - if: needs.changes.outputs.required == 'true' && runner.os == 'Linux'
        run: pnpm run audit:prod

  website:
    needs: changes
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require a successful website scope decision
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          SCOPE_REQUIRED: ${{ needs.changes.outputs.website }}
        run: node -e "if (process.env.SCOPE_RESULT !== 'success' || !['true', 'false'].includes(process.env.SCOPE_REQUIRED)) process.exit(1)"
      - if: needs.changes.outputs.website == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.website == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: needs.changes.outputs.website == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: needs.changes.outputs.website == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: needs.changes.outputs.website == 'true'
        run: pnpm run check:website
      - if: needs.changes.outputs.website == 'true'
        run: pnpm run build:website
      - name: Validate noindex preview output
        if: needs.changes.outputs.website == 'true'
        env:
          WEBSITE_NOINDEX: 'true'
        run: pnpm --filter @opentig/website run build --outDir ../.ai/website-preview

  system-trash-smoke:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/main/platform/SystemTrash.integration.test.ts
        env:
          OPENTIG_SYSTEM_TRASH_INTEGRATION: '1'

  headless-tarball-smoke:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify CLI discovery on the native platform
        # Bound native process contention, including cold Windows PowerShell startup.
        env:
          OPENTIG_POWERSHELL_INTEGRATION: '1'
        run: pnpm exec vitest run src/main/ai src/main/github/GitHubService.test.ts src/main/persistence/SettingsStore.test.ts --maxWorkers=2
      - name: Prepare isolated runner user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: pnpm run release:pack:headless
      - run: pnpm run release:inspect:headless
      - name: Verify native CLI service lifecycle
        run: pnpm exec vitest run packages/server/src/service-manager.integration.test.ts packages/server/src/cli-command.test.ts packages/server/src/service-manager.test.ts packages/server/src/service-eligibility.test.ts packages/server/src/service-npm.test.ts packages/server/src/service-update-worker.test.ts
        env:
          OPENTIG_SERVICE_INTEGRATION: '1'
      - name: Run packed CLI with npx
        shell: bash
        run: |
          artifact="$(node -p "require('./dist/headless/opentig-headless.json').filename")"
          npx --yes --package "./dist/headless/$artifact" opentig --version
      - run: npm install --global --allow-scripts=bun bun@1.3.0
      - name: Run packed CLI with bunx
        shell: bash
        run: |
          artifact="$(node -p "require('node:path').resolve('dist/headless', require('./dist/headless/opentig-headless.json').filename)")"
          bunx --package "$artifact" opentig --version
