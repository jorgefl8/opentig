<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTig social card source</title>
    <link rel="preload" href="../public/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: Geist;
        src: url('../public/fonts/Geist.woff2') format('woff2');
        font-weight: 100 900;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #ededed;
        background: #090909;
        font-family: Geist, sans-serif;
      }
      main {
        position: relative;
        height: 100%;
        background: radial-gradient(ellipse 60% 70% at 50% 110%, #2266ea4d, transparent 70%);
      }
      header { position: absolute; left: 56px; right: 56px; top: 40px; display: flex; align-items: center; gap: 14px; }
      .logo { width: 52px; height: 52px; }
      .brand { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
      .domain { margin-left: auto; font-size: 24px; color: #a6a6ad; }
      h1 { position: absolute; left: 56px; top: 112px; margin: 0; font-size: 46px; line-height: 1.08; font-weight: 650; letter-spacing: -1.5px; }
      h1 em { font-style: normal; color: #6f9dff; }
      .workspace {
        position: absolute;
        left: 56px;
        top: 236px;
        width: 880px;
        height: auto;
        border: 1px solid #3a4a63;
        border-radius: 12px;
        box-shadow: 0 20px 70px #000c;
      }
      /* Thin bezels: the 238 x 498 screen matches the 390 x 816 capture, so nothing is cropped. */
      .phone {
        position: absolute;
        right: 70px;
        top: 104px;
        width: 246px;
        height: 506px;
        padding: 4px;
        border-radius: 38px;
        background: #26262b;
        box-shadow: inset 0 0 0 1px #4a4a55, 0 30px 80px #000e, 0 0 90px #2266ea40;
      }
      .phone img { display: block; width: 238px; height: 498px; border-radius: 34px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="../public/favicon.svg" alt="" />
        <span class="brand">OpenTig</span>
        <span class="domain">opentig.com</span>
      </header>
      <h1>Your Git workspace,<br /><em>on desktop and phone.</em></h1>
      <img class="workspace" src="../../docs/images/workspace.png" width="2880" height="1320" alt="OpenTig showing an open pull request and its side-by-side JavaScript diff in the Launchpad sample repository" />
      <div class="phone">
        <img src="../../docs/images/workspace-phone.png" width="780" height="1632" alt="The same pull request on a phone, ready to merge" />
      </div>
    </main>
  </body>
</html>
