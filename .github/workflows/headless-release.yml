name: CLI release draft
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable draft tag to complete, e.g. v0.1.2'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cli-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'jorgefl8/opentig' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      # Keep release tooling separate so existing tags can be completed too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || inputs.tag }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - id: identity
        working-directory: source
        run: node scripts/validate-release-tag.mjs
        env:
          OPENTIG_RELEASE_TAG: ${{ inputs.tag }}
          OPENTIG_RELEASE_COMMIT: ${{ inputs.commit }}
      - run: npm ci
        working-directory: source
      - run: npm run release:pack:headless && npm run release:inspect:headless
        working-directory: source
      - name: Record and verify the source identity
        run: node automation/scripts/headless-release.mjs stamp source/dist/headless "$RELEASE_TAG" "$RELEASE_COMMIT"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
      - name: Install the packed CLI globally and verify its runtime
        working-directory: source
        run: |
          artifact="$(node -p "require('./dist/headless/opentig-headless.json').filename")"
          npm install --global "./dist/headless/$artifact"
          test "$(opentig --version)" = "${RELEASE_TAG#v}"
          node ../automation/scripts/smoke-headless-release.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-release
          path: source/dist/headless/*
          if-no-files-found: error
          retention-days: 30
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: opentig-stable-release-draft
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-release
          path: release-assets
      - name: Attach CLI to the draft without replacing existing assets
        run: node scripts/headless-release.mjs upload release-assets "$RELEASE_TAG" "$RELEASE_COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
      - name: Summary
        run: echo 'CLI tarball and integrity/source metadata attached. Publish the release only after all Windows and CLI jobs succeed.' >> "$GITHUB_STEP_SUMMARY"
