name: Desktop Dev builds

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require passing CI for the selected commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          ci_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch "$TARGET_BRANCH" --commit "$TARGET_SHA" --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$ci_run" ]; then
            echo "::error::No CI run exists for this commit. Run the CI workflow on this branch, then rerun Desktop Dev builds."
            exit 1
          fi
          gh run watch "$ci_run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
          passed="$(gh run view "$ci_run" --repo "$GITHUB_REPOSITORY" \
            --json headSha,conclusion \
            --jq '.headSha == env.TARGET_SHA and .conclusion == "success"')"
          if [ "$passed" != "true" ]; then
            echo "::error::CI must succeed for this exact commit before desktop packaging."
            exit 1
          fi

  dev-artifacts:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run make:dev
      - if: runner.os == 'Windows'
        run: npm run verify:clipboard
      - run: npm run verify:packaged-desktop -- --dev
      - run: npm run verify:packaged-server -- --dev
      - if: runner.os == 'Windows'
        run: npm run verify:packaged-utility -- --dev
      - if: runner.os == 'Windows'
        run: npm run verify:packaged-trash -- --dev
      - name: Upload portable Dev build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenTig-Dev-${{ runner.os }}-manual-${{ github.run_id }}
          path: out/make/dev/**/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
