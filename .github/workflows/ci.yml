name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit:prod

  system-trash-smoke:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/main/platform/SystemTrash.integration.test.ts
        env:
          OPENTIG_SYSTEM_TRASH_INTEGRATION: '1'

  headless-tarball-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:pack:headless
      - run: npm run release:inspect:headless
      - name: Run packed CLI with npx
        shell: bash
        run: |
          artifact="$(node -p "require('./dist/headless/opentig-headless.json').filename")"
          npx --yes --package "./dist/headless/$artifact" opentig --version
      - run: npm install --global bun@1.3.0
      - name: Run packed CLI with bunx
        shell: bash
        run: |
          artifact="$(node -p "require('node:path').resolve('dist/headless', require('./dist/headless/opentig-headless.json').filename)")"
          bunx --package "$artifact" opentig --version

  dev-artifacts:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run make:dev
      - run: npm run verify:packaged-desktop -- --dev
      - run: npm run verify:packaged-server -- --dev
      - if: runner.os == 'Windows'
        run: npm run verify:packaged-utility -- --dev
      - if: runner.os == 'Windows'
        run: npm run verify:packaged-trash -- --dev
      - name: Upload portable Dev build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenTig-Dev-${{ runner.os }}-${{ github.event.pull_request.number || 'main' }}-${{ github.run_id }}
          path: out/make/dev/**/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
