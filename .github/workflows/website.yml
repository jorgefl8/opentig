name: Deploy website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opentig-website-production
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.repository == 'jorgefl8/opentig' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: website-production
    timeout-minutes: 15
    env:
      WEBSITE_UMAMI_ID: ${{ vars.WEBSITE_UMAMI_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Require production configuration without printing values
        run: |
          node --input-type=module - <<'NODE'
          for (const name of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'WEBSITE_UMAMI_ID']) {
            if (!process.env[name]?.trim()) throw new Error(`Missing required deployment setting: ${name}`);
          }
          NODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check:website
      - name: Record the latest stable release for the build
        run: gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest-release.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm run build:website
        env:
          WEBSITE_RELEASE_FILE: ${{ runner.temp }}/latest-release.json
      - name: Deploy the validated build with the pinned Wrangler CLI
        working-directory: website
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Tell search engines which pages changed
        # A refused or unreachable IndexNow ping must not fail an already finished deployment.
        continue-on-error: true
        run: node website/scripts/indexnow.mjs website/dist/sitemap.xml
