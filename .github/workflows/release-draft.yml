name: Next release draft
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  draft:
    if: github.repository == 'jorgefl8/opentig' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: opentig-stable-release-draft
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Accumulate merged PRs and direct commits in one draft
        run: node scripts/release-draft.mjs
        env:
          GH_TOKEN: ${{ github.token }}
