packages:
  - packages/*
  - website

# Desktop packaging stages runtime dependencies from a flat, npm-style
# node_modules tree, so keep pnpm's hoisted layout.
nodeLinker: hoisted

catalog:
  # Mermaid renders math with the same KaTeX version as the app.
  katex: 0.18.10

overrides:
  mermaid>katex: 'catalog:'
  # Sileo's toasts use only `motion.rect`; one copy of the animation library is
  # downloaded at start-up instead of two.
  sileo>motion: ^14.12.0
  # One version of the WebAssembly runtime for Node addons: a 2.0 beta of one half beside a 1.x of
  # the other breaks the Astro checker (`setLastError is not a function`).
  '@emnapi/core': 1.11.3
  '@emnapi/runtime': 1.11.3

allowBuilds:
  electron-winstaller: true
  esbuild: true
  fsevents: true
  uiohook-napi: true
  workerd: true

auditConfig:
  ignoreGhsas:
    # picomatch: a crafted glob pattern can take very long to match. Every
    # version is affected and none is patched yet. It reaches this workspace only
    # through the website's build tools, which match patterns written in this
    # repository. Remove this entry once a patched picomatch is installed.
    - GHSA-fc5q-39xc-vjpf
